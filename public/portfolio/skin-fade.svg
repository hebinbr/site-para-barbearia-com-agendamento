    <line x1="-82" y1="-102" x2="82" y2="-102" stroke="#E5D1B0" stroke-opacity="0.65" stroke-width="1.5"/>
    <line x1="-82" y1="-84" x2="82" y2="-84" stroke="#C8A97E" stroke-opacity="0.45" stroke-width="1.2"/>
    <line x1="-82" y1="-66" x2="82" y2="-66" stroke="#C8A97E" stroke-opacity="0.28" stroke-width="1"/>
    <line x1="-78" y1="-48" x2="78" y2="-48" stroke="#C8A97E" stroke-opacity="0.15" stroke-width="1"/>
