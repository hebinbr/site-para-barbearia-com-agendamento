    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAFAF9"/>
      <stop offset="55%" stop-color="#C8A97E"/>
      <stop offset="100%" stop-color="#7A6240"/>
